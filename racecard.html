<script>
// --- Get race_id from URL
const params = new URLSearchParams(window.location.search);
const raceId = params.get('race_id');

// --- Get all races
const races = (window.racecardsData && window.racecardsData.racecards) || [];
const race = races.find(r => (r.race_id || r._id) === raceId);

// --- Pretty render
if (race) {
  renderRace(race, races, "today");
} else {
  document.getElementById('mainRacecard').innerHTML = "<h2>Race not found (broken link or data mismatch)</h2>";
}

</script>
